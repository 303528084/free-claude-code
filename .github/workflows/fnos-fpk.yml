name: 飞牛 FPK 打包

# 把 fnos-fpk/freeclaudecode 打成飞牛原生应用包（.fpk），挂到对应汉化 Release 上。
#   - 载荷：自带 CPython 3.14.10（编译进 /var/apps 生产路径）+ venv + 本仓库 Release 的汉化 wheel
#   - 打包：fnpack 1.3.3（官方公开直链，非签名短链）
#   - 产物：freeclaudecode.fpk，约 150-250MB
#
# 触发：
#   1. 手动（推荐）：填汉化修订号，自动算出 zh-v<上游版本>-<修订> 标签
#   2. 推 fpk-v* 标签

on:
  workflow_dispatch:
    inputs:
      zh_revision:
        description: 同一上游版本的汉化修订号（第几版汉化）
        required: false
        default: "1"
        type: string
      dry_run:
        description: 只构建产物不发布
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "fpk-v*"

permissions:
  contents: write

concurrency:
  group: fnos-fpk-${{ github.ref }}
  cancel-in-progress: false

env:
  APPNAME: freeclaudecode
  FNPACK_URL: https://static2.fnnas.com/fnpack/fnpack-1.3.3-linux-amd64
  PKG_DIR: fnos-fpk/freeclaudecode

jobs:
  fpk:
    name: 构建并发布 FPK
    # 必须用 ubuntu-22.04（glibc 2.35）：飞牛 fnOS 是 Debian 12 / glibc 2.36，
    # ubuntu-latest(24.04, glibc 2.39) 编出来的 python 在 NAS 上会报 GLIBC_2.38 not found
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 安装 fnpack
        run: |
          set -euo pipefail
          # static2.fnnas.com 偶发连接重置，多试几次
          for i in 1 2 3 4 5; do
            if sudo curl -fsS --retry 3 --retry-all-errors --connect-timeout 15 -o /usr/local/bin/fnpack "$FNPACK_URL"; then
              break
            fi
            echo "fnpack 下载失败，第 $i 次重试"
            sleep 5
            [ "$i" = 5 ] && { echo "fnpack 多次下载失败" >&2; exit 1; }
          done
          sudo chmod +x /usr/local/bin/fnpack
          fnpack --help > /tmp/fnp-help.txt 2>&1 || true
          sed -n '1,3p' /tmp/fnp-help.txt

      - name: 准备 /var/apps（供缓存与载荷使用）
        run: |
          set -euo pipefail
          sudo mkdir -p /var/apps/${APPNAME}/app
          sudo chown -R "$(id -u):$(id -g)" /var/apps/${APPNAME}

      - name: 缓存 CPython 运行时
        uses: actions/cache@v4
        with:
          path: /var/apps/${{ env.APPNAME }}/app/runtime/python
          key: cpython-3.14.10-gnu2204-prefix-${{ env.APPNAME }}-v1

      - name: 计算汉化版本与标签
        id: version
        env:
          ZH_REVISION: ${{ inputs.zh_revision }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "使用推送的标签：${GITHUB_REF_NAME}"
            exit 0
          fi
          base="$(git describe --tags --abbrev=0 --match 'v*')" || {
            echo "仓库里没有 v* 标签，无法推导上游版本" >&2
            exit 1
          }
          base_version="${base#v}"
          revision="${ZH_REVISION:-1}"
          if ! [[ "$revision" =~ ^[1-9][0-9]*$ ]]; then
            echo "汉化修订号必须是正整数：$revision" >&2
            exit 1
          fi
          tag="zh-v${base_version}-${revision}"
          {
            echo "BASE_VERSION=$base_version"
            echo "VERSION=${base_version}+zh.${revision}"
            echo "TAG=${tag}"
          } >> "$GITHUB_ENV"
          echo "目标标签 ${tag}（上游版本 ${base_version}，汉化修订 ${revision}）"

      - name: 装配运行时载荷
        env:
          ZH_TAG: ${{ env.TAG }}
          ZH_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          # wheel 文件名里带 "+"，下载 URL 必须写成 %2B
          enc_version="${ZH_VERSION//+/%2B}"
          WHEEL_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${ZH_TAG}/free_claude_code-${enc_version}-py3-none-any.whl"
          echo "wheel：$WHEEL_URL"
          curl -sILf "$WHEEL_URL" > /dev/null || { echo "该 Release 还没有 wheel，先跑「汉化版发布」工作流"; exit 1; }
          sudo env WHEEL_URL="$WHEEL_URL" bash "$PKG_DIR/scripts/build_payload.sh"
          sudo chown -R "$(id -u):$(id -g)" "$PKG_DIR" "/var/apps/${APPNAME}"

      - name: 配置开发者证书（可选）
        id: cert
        env:
          FNPACK_KEY_B64: ${{ secrets.FNPACK_DEV_KEY_B64 }}
          FNPACK_CRT_B64: ${{ secrets.FNPACK_DEV_CRT_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${FNPACK_KEY_B64:-}" ] && [ -n "${FNPACK_CRT_B64:-}" ]; then
            printf '%s' "$FNPACK_KEY_B64" | base64 -d > "$RUNNER_TEMP/developer.key"
            printf '%s' "$FNPACK_CRT_B64" | base64 -d > "$RUNNER_TEMP/developer.crt"
            chmod 600 "$RUNNER_TEMP/developer.key"
            echo "SIGN_ARGS=--key $RUNNER_TEMP/developer.key --cert $RUNNER_TEMP/developer.crt" >> "$GITHUB_ENV"
            echo "签名方式：使用仓库 Secrets 里的开发者证书" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SIGN_ARGS=--nosign" >> "$GITHUB_ENV"
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "签名方式：**--nosign（未签名，仅供本地调试安装）**。要正式分发，请在仓库 Secrets 里配 \`FNPACK_DEV_KEY_B64\` 与 \`FNPACK_DEV_CRT_B64\`（分别是 developer.key / developer.crt 的 base64）。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 打包 FPK
        run: |
          set -euo pipefail
          cd "$PKG_DIR/.."
          # manifest 里的应用版本必须是「上游版本-汉化修订」，否则换了上游版本后
          # 应用中心仍按旧版本号判断（同版本不会替换载荷，升级也看不出版本变化）。
          sudo sed -i "s/^version[[:space:]]*=[[:space:]]*.*/version=${BASE_VERSION}-${ZH_REVISION:-1}/" "./${APPNAME}/manifest"
          grep -E '^version' "./${APPNAME}/manifest"
          # fnOS 解包时不是以 root 跑 tar 的：条目属主若不是 root，chown 会失败并让 tar 非零退出，
          # 应用中心就报「解压 app.tgz 失败」。所以把属主统一成 root:root 再打。
          sudo chown -R root:root "./${APPNAME}"
          sudo find "./${APPNAME}" -type d -exec chmod 755 {} +
          # 入口脚本必须有可执行位（Windows 上检出的文件会丢）
          sudo chmod 755 "./${APPNAME}"/cmd/* "./${APPNAME}"/scripts/*.sh 2>/dev/null || true
          # shellcheck disable=SC2086
          sudo fnpack build --directory "./${APPNAME}" $SIGN_ARGS
          fpk="$(find . -maxdepth 3 -name '*.fpk' | head -n 1)"
          [ -n "$fpk" ] || { echo "没找到 fnpack 产物"; ls -la; exit 1; }
          fpk="$(realpath "$fpk")"
          ls -lh "$fpk"
          size=$(stat -c %s "$fpk")
          if [ "$size" -lt 50000000 ]; then
            echo "FPK 只有 $size 字节，载荷可能没打进去（预期 >100MB）" >&2
            exit 1
          fi
          echo "FPK=$fpk" >> "$GITHUB_ENV"
          echo "产物 $fpk，$(numfmt --to=iec "$size")"

      - name: 只保留 ASCII 且带版本号的文件名
        run: |
          set -euo pipefail
          # fnpack 产物名是固定的 <appname>.fpk；另存一份带版本号的，避免下载页看不出是哪个版本
          final="$RUNNER_TEMP/${APPNAME}-${VERSION}.fpk"
          cp "$FPK" "$final"
          ls -lh "$final"
          echo "FPK_FINAL=$final" >> "$GITHUB_ENV"

      - name: 冒烟检查（包结构）
        run: |
          set -euo pipefail
          file "$FPK"
          list="$(tar -tzf "$FPK")"
          echo "包内条目数：$(echo "$list" | wc -l)"
          echo "$list" | head -n 25
          for f in manifest cmd/main config/privilege config/resource wizard/install ICON.PNG ICON_256.PNG app.tgz; do
            echo "$list" | grep -qx "$f" || { echo "缺少必要条目：$f" >&2; exit 1; }
          done
          echo "--- manifest 版本 ---"
          pkg_version="$(tar -xzf "$FPK" -O manifest | grep -E '^version' | tr -d ' ' | cut -d= -f2)"
          echo "包内 version=${pkg_version}，期望 ${BASE_VERSION}-${ZH_REVISION:-1}"
          [ "$pkg_version" = "${BASE_VERSION}-${ZH_REVISION:-1}" ] || { echo "manifest 版本与本次构建不一致" >&2; exit 1; }
          echo "--- app.tgz 内部（载荷是否打进去了）---"
          applist="$RUNNER_TEMP/applist.txt"
          tar -xzf "$FPK" -O app.tgz | tar -tzf - | sed 's#^\./##' > "$applist"
          echo "app.tgz 内条目数：$(wc -l < "$applist")"
          head -n 12 "$applist"
          for f in ui/config ui/images/icon_64.png shim/gateway_shim.py venv/bin/fcc-server runtime/python/bin/python3; do
            if grep -qF -- "$f" "$applist"; then echo "OK   $f"; else echo "MISS $f" >&2; missing=1; fi
          done
          [ -z "${missing:-}" ] || { echo "载荷不完整，安装后服务会起不来" >&2; exit 1; }

          echo "--- 属主与可执行位（fnOS 解包靠 root:root 才不报错）---"
          badowner=$(tar -xzf "$FPK" -O app.tgz | tar -tvzf - | awk '$2 != "root/root" {print}' | head -n 20 || true)
          if [ -n "$badowner" ]; then echo "app.tgz 里有非 root:root 条目：" >&2; echo "$badowner" >&2; exit 1; fi
          echo "app.tgz 内所有条目均为 root:root"
          tar -tvzf "$FPK" | grep -E ' cmd/main$' | sed 's/^/cmd\/main：/'

          echo "--- 运行时 glibc 依赖（fnOS 只有 2.36）---"
          maxreq=$(objdump -T "$PKG_DIR/app/runtime/python/bin/python3.14" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)
          echo "python3.14 最高要求：${maxreq:-未知}"
          if [ -n "$maxreq" ] && [ "$(printf '%s\n2.36\n' "$maxreq" | sort -V | tail -n 1)" != "2.36" ]; then
            echo "构建机 glibc 太新（要求 ${maxreq} > 2.36），NAS 上会起不来" >&2
            exit 1
          fi

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: fnos-fpk-${{ env.TAG }}
          path: ${{ env.FPK }}
          if-no-files-found: error
          compression-level: 0

      - name: 发布到对应 Release
        if: ${{ !inputs.dry_run && github.ref_type != 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ZH_TAG: ${{ env.TAG }}
          ZH_VERSION: ${{ env.VERSION }}
          ZH_REVISION_INPUT: ${{ inputs.zh_revision }}
          SIGNED: ${{ env.SIGNED }}
        run: |
          set -euo pipefail
          if [ "${SIGNED:-true}" = "false" ]; then
            SIG_NOTE="未签名（fnpack --nosign），仅供本地调试安装"
          else
            SIG_NOTE="已使用开发者证书签名"
          fi
          notes="$RUNNER_TEMP/fpk-notes.md"
          cat > "$notes" <<NOTES
          汉化版 **$ZH_VERSION**（汉化修订 $ZH_REVISION_INPUT）的飞牛 fnOS 原生应用包。

          ## 这是什么

          - 不是在 Docker 里跑，而是飞牛原生应用（FPK），由系统接管启停与状态
          - 自带 CPython 3.14.10 与全部依赖，不依赖应用中心的 python312
          - 桌面入口走飞牛统一网关（Unix Socket），在飞牛桌面窗口内直接打开汉化 Admin
          - 局域网模型客户端走 \${TRIM_SERVICE_PORT} 端口（默认 8586）

          ## 安装

          应用中心 → 手动安装 → 选择 \`${APPNAME}-${VERSION}.fpk\`；
          安装向导里填 API 令牌（≥32 位）并选择是否允许局域网客户端直连。

          ## 注意

          - 仅 x86_64 设备
          - 签名：$SIG_NOTE
          - 管理页面只对 NAS 管理员可见；局域网端口上的 /admin 仍会 403

          ## 许可证与源码（AGPL-3.0-only）

          - 本项目基于 [Alishahryar1/free-claude-code](https://github.com/Alishahryar1/free-claude-code)，以 AGPL-3.0-only 发布；修改内容见仓库 [NOTICE](https://github.com/${GITHUB_REPOSITORY}/blob/zh-cn/NOTICE)。
          - 每个 Release 同时附带 \`${APPNAME}-${VERSION}-source.tar.gz\`：构建该 FPK 所用的完整源码归档（zh-cn 分支源码树）。
          - 按 AGPL-3.0，再分发本二进制须同时提供对应源码；将本程序作为网络服务提供给他人使用（§13）时，须向使用者提供源码获取方式。
          NOTES
          gh release view "$ZH_TAG" > /dev/null 2>&1 || \
            gh release create "$ZH_TAG" --title "汉化版 v$(echo "$ZH_VERSION" | cut -d+ -f1)（汉化修订 $ZH_REVISION_INPUT）" --notes-file "$notes"
          gh release upload "$ZH_TAG" "$FPK_FINAL" --clobber
          # AGPL-3.0 合规：二进制分发的对应源码（当前提交的完整源码树）
          SRC_ARCHIVE="$RUNNER_TEMP/${APPNAME}-${VERSION}-source.tar.gz"
          git archive --format=tar.gz --prefix="${APPNAME}-${VERSION}/" -o "$SRC_ARCHIVE" HEAD
          gh release upload "$ZH_TAG" "$SRC_ARCHIVE" --clobber
          echo "已上传对应源码 ${APPNAME}-${VERSION}-source.tar.gz"
          # 旧的无版本号资产清掉，避免下载页同时挂两个同名内容的包
          gh release delete-asset "$ZH_TAG" "${APPNAME}.fpk" -y 2>/dev/null || true
          # 已存在的 Release：把 FPK 说明段追加进去（先剥掉上一版同段落，避免重跑叠加）
          base="$RUNNER_TEMP/release-base.md"
          gh release view "$ZH_TAG" --json body -q .body 2>/dev/null | \
            awk '/<!-- fpk:begin -->/{s=1} !s{print} /<!-- fpk:end -->/{s=0}' > "$base" || true
          merged="$RUNNER_TEMP/release-merged.md"
          { cat "$base"; echo; echo '<!-- fpk:begin -->'; cat "$notes"; echo '<!-- fpk:end -->'; } > "$merged"
          gh release edit "$ZH_TAG" --notes-file "$merged"
          echo "已更新 Release 说明"
          echo "已上传 $FPK_FINAL 到 Release $ZH_TAG"

      - name: 汇总
        run: |
          {
            echo "### 飞牛 FPK 构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 标签 | \`$TAG\` |"
            echo "| 产物 | \`$FPK\` |"
            echo "| 体积 | $(du -h "$FPK" | cut -f1) |"
            echo "| 载荷 | $(du -sh "$PKG_DIR/app/runtime/python" | cut -f1) + $(du -sh "$PKG_DIR/app/venv" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

